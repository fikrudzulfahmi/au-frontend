# Deploy Frontend (SPA) ke sipandu.smkiau.sch.id — RILIS ATOMIK.
#
# Latar masalah: versi lama menyalin `dist` menimpa docroot dengan `overwrite: true`.
# Selama proses itu `index.html` baru bisa sudah ada sementara bundel JS-nya belum
# selesai terunggah, sehingga pengunjung pada jendela tersebut menerima halaman yang
# menunjuk berkas tidak ada ("frontend gagal terhubung ke API"). Karena service worker
# mem-precache `index.html`, keadaan rusak itu bisa terkunci di peramban pengguna.
#
# Cara sekarang:
#   1. Build diunggah ke folder rilis per-run DI LUAR docroot (tidak dapat diakses web).
#   2. Aset disalin lebih dulu — nama berkas Vite ber-hash, jadi tidak pernah menimpa
#      berkas yang masih dipakai versi lama.
#   3. `index.html` ditukar PALING AKHIR dengan `mv` pada filesystem yang sama (atomik).
#   4. Bila pemeriksaan kesehatan gagal, `index.html` lama dikembalikan otomatis.
#
# CATATAN SSH: sengaja memakai klien SSH asli, bukan action pihak ketiga.
# Pencocokan kunci host pada `drone-scp` hanya menerima SATU sidik jari, sedangkan tipe
# kunci yang dinegosiasikan klien Go-nya bisa berbeda — hasilnya "host key fingerprint
# mismatch". Di sini seluruh kunci hasil `ssh-keyscan` dipakai sebagai known_hosts
# (tipe apa pun yang dinegosiasikan tetap cocok), DAN sidik jarinya diverifikasi terhadap
# secret sehingga kunci host palsu tetap ditolak.

name: Deploy Frontend (SPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-spa
  cancel-in-progress: false

# Prinsip hak paling kecil: workflow ini hanya perlu membaca repo.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Periksa sidik jari host (wajib)
        # Dijalankan SEBELUM apa pun diunggah. Tanpa sidik jari, SSH bisa menerima
        # kunci host mana saja (rawan penyadapan di tengah jalan).
        # Secret boleh berisi satu nilai, atau tempelan `ssh-keyscan` utuh (tiga baris);
        # yang dipakai cukup satu untuk DIPERIKSA, sedangkan penyambungan memakai
        # seluruh kunci hasil scan.
        id: sidik
        env:
          MENTAH: ${{ secrets.SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ -z "${MENTAH}" ]; then
            echo "::error::Secret SSH_FINGERPRINT belum diisi."
            echo "Ambil: ssh-keyscan -p <SSH_PORT> <SSH_HOST> 2>/dev/null | ssh-keygen -lf -"
            exit 1
          fi
          nilai=$(printf '%s\n' "$MENTAH" | grep -oE 'SHA256:[A-Za-z0-9+/=]+' | head -1 || true)
          if [ -z "$nilai" ]; then
            echo "::error::SSH_FINGERPRINT tidak memuat nilai berbentuk SHA256:..."
            exit 1
          fi
          echo "Sidik jari acuan: $nilai"
          echo "nilai=$nilai" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}

      - name: Pastikan hasil build lengkap
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          test -f dist/.htaccess   # rewrite SPA untuk deep link
          # Setiap berkas yang dirujuk index.html harus benar-benar ada.
          for rujukan in $(grep -oE '/assets/[A-Za-z0-9._-]+\.(js|css)' dist/index.html | sort -u); do
            test -f "dist${rujukan}" || { echo "::error::Berkas ${rujukan} dirujuk index.html tetapi tidak ada"; exit 1; }
          done
          echo "Hasil build lengkap."

      - name: Unggah rilis dan tukar secara atomik
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USER_SSH: ${{ secrets.SSH_USER }}
          KUNCI: ${{ secrets.SSH_KEY }}
          FRASA: ${{ secrets.SSH_PASSPHRASE }}
          SIDIK: ${{ steps.sidik.outputs.nilai }}
          LIVE_DIR: ${{ secrets.DEPLOY_PATH_SPA }}
          RELEASES_DIR: ${{ secrets.DEPLOY_RELEASES_PATH || 'sipandu-releases' }}
          RELEASE_ID: ${{ github.run_id }}
          DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          set -euo pipefail
          : "${HOST:?SSH_HOST kosong}" ; : "${PORT:?SSH_PORT kosong}" ; : "${USER_SSH:?SSH_USER kosong}"
          : "${KUNCI:?SSH_KEY kosong}" ; : "${LIVE_DIR:?DEPLOY_PATH_SPA kosong}"

          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KUNCI" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # Bila kunci dilindungi frasa sandi, buat salinan tanpa frasa (hanya di runner).
          if [ -n "${FRASA:-}" ]; then
            ssh-keygen -p -P "$FRASA" -N '' -f "$HOME/.ssh/deploy_key" >/dev/null
          fi

          # --- Kunci host: ambil semua tipe, lalu VERIFIKASI terhadap sidik jari acuan.
          ssh-keyscan -T 15 -p "$PORT" "$HOST" 2>/dev/null > /tmp/scan_known_hosts || true
          if [ ! -s /tmp/scan_known_hosts ]; then
            echo "::error::Tidak dapat mengambil kunci host dari $HOST:$PORT"; exit 1
          fi
          ssh-keygen -lf /tmp/scan_known_hosts | tee /tmp/daftar_sidik
          if ! grep -qF "$SIDIK" /tmp/daftar_sidik; then
            echo "::error::Sidik jari host TIDAK cocok dengan secret — kemungkinan penyadapan atau server berganti kunci. Deploy dihentikan."
            exit 1
          fi
          cp /tmp/scan_known_hosts "$HOME/.ssh/known_hosts" && chmod 600 "$HOME/.ssh/known_hosts"

          OPS="-i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20"
          REMOTE="$USER_SSH@$HOST"

          echo "Menguji sambungan…"
          ssh $OPS "$REMOTE" 'echo tersambung' >/dev/null

          # --- Kemas dan unggah ke folder rilis (di luar docroot).
          tar czf /tmp/rilis.tgz -C dist .
          echo "Paket rilis: $(du -h /tmp/rilis.tgz | cut -f1)"
          ssh $OPS "$REMOTE" "mkdir -p '$RELEASES_DIR/$RELEASE_ID'"
          scp $OPS /tmp/rilis.tgz "$REMOTE:$RELEASES_DIR/$RELEASE_ID/rilis.tgz"
          ssh $OPS "$REMOTE" "cd '$RELEASES_DIR/$RELEASE_ID' && tar xzf rilis.tgz && rm -f rilis.tgz && ls -1 | head -8"

          # --- Tukar rilis (atomik) + rollback otomatis bila kesehatan gagal.
          ssh $OPS "$REMOTE" \
            "LIVE_DIR='$LIVE_DIR' RELEASES_DIR='$RELEASES_DIR' RELEASE_ID='$RELEASE_ID' DOMAIN='${DOMAIN:-}' bash -s" <<'SKRIP_JARAK_JAUH'
          set -euo pipefail
          # Tidak memakai `set -x`: jangan pernah mencetak nilai rahasia.

          RILIS="$RELEASES_DIR/$RELEASE_ID"
          CADANGAN="$RELEASES_DIR/cadangan-index.html"

          test -f "$RILIS/index.html" || { echo "::error::index.html tidak ada di rilis"; ls -la "$RILIS"; exit 1; }
          test -d "$RILIS/assets"     || { echo "::error::folder assets tidak ada di rilis"; exit 1; }
          test -d "$LIVE_DIR"         || { echo "::error::docroot tidak ditemukan: $LIVE_DIR"; exit 1; }

          echo "Rilis : $RILIS"
          echo "Live  : $LIVE_DIR"

          # 1. Aset lebih dulu (nama ber-hash, tidak menimpa berkas versi lama).
          mkdir -p "$LIVE_DIR/assets"
          cp -a "$RILIS/assets/." "$LIVE_DIR/assets/"
          if [ -d "$RILIS/icons" ]; then
            mkdir -p "$LIVE_DIR/icons"
            cp -a "$RILIS/icons/." "$LIVE_DIR/icons/"
          fi

          # 2. Service worker & manifest sebelum index.html.
          for f in sw.js registerSW.js manifest.webmanifest; do
            if [ -f "$RILIS/$f" ]; then
              install -m 644 "$RILIS/$f" "$LIVE_DIR/$f.baru"
              mv -f "$LIVE_DIR/$f.baru" "$LIVE_DIR/$f"
            fi
          done

          # 3. Cadangkan index lama untuk rollback.
          if [ -f "$LIVE_DIR/index.html" ]; then cp -a "$LIVE_DIR/index.html" "$CADANGAN"; fi

          # 4. TITIK ATOMIK.
          install -m 644 "$RILIS/index.html" "$LIVE_DIR/index.html.baru"
          mv -f "$LIVE_DIR/index.html.baru" "$LIVE_DIR/index.html"
          echo "index.html ditukar secara atomik."

          # 5. Pemeriksaan kesehatan; batalkan bila gagal.
          if [ -n "${DOMAIN:-}" ]; then
            kode="000"
            for i in 1 2 3 4 5; do
              kode=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "https://$DOMAIN/" || echo 000)
              [ "$kode" = "200" ] && break
              sleep 3
            done
            if [ "$kode" != "200" ]; then
              echo "::error::Situs menjawab $kode setelah swap — mengembalikan versi sebelumnya."
              if [ -f "$CADANGAN" ]; then
                install -m 644 "$CADANGAN" "$LIVE_DIR/index.html.kembali"
                mv -f "$LIVE_DIR/index.html.kembali" "$LIVE_DIR/index.html"
                echo "Rollback selesai."
              fi
              exit 1
            fi
            echo "Kesehatan lolos (HTTP $kode)."
          fi

          # 6. Sisakan 5 rilis terakhir.
          n=0
          for d in $(ls -1dt "$RELEASES_DIR"/*/ 2>/dev/null); do
            n=$((n + 1))
            if [ "$n" -gt 5 ]; then rm -rf "$d"; fi
          done

          # 7. Izin: HANYA berkas yang baru dipasang (jangan sentuh milik server).
          if [ -d "$LIVE_DIR/assets" ]; then
            chmod 755 "$LIVE_DIR/assets"; find "$LIVE_DIR/assets" -type f -exec chmod 644 {} + 2>/dev/null || true
          fi
          if [ -d "$LIVE_DIR/icons" ]; then
            chmod 755 "$LIVE_DIR/icons"; find "$LIVE_DIR/icons" -type f -exec chmod 644 {} + 2>/dev/null || true
          fi
          for f in index.html sw.js registerSW.js manifest.webmanifest; do
            [ -f "$LIVE_DIR/$f" ] && chmod 644 "$LIVE_DIR/$f"
          done

          echo "Deploy selesai: rilis $RELEASE_ID aktif."
          SKRIP_JARAK_JAUH

          rm -f "$HOME/.ssh/deploy_key" /tmp/rilis.tgz

      - name: Verifikasi dari runner
        env:
          DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          set -euo pipefail
          if [ -z "${DOMAIN}" ]; then
            echo "::warning::Secret DEPLOY_DOMAIN belum diisi — verifikasi pasca-deploy dilewati."
            exit 0
          fi
          for jalur in / /masuk /dashboard /tv; do
            kode=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "https://${DOMAIN}${jalur}" || echo 000)
            echo "${jalur} -> ${kode}"
            [ "$kode" = "200" ] || { echo "::error::${jalur} menjawab ${kode}, seharusnya 200"; exit 1; }
          done
          bundel=$(curl -s -m 15 "https://${DOMAIN}/" | grep -oE '/assets/[A-Za-z0-9._-]+\.js' | head -1)
          test -n "$bundel"
          kode=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "https://${DOMAIN}${bundel}")
          echo "${bundel} -> ${kode}"
          [ "$kode" = "200" ] || { echo "::error::Bundel ${bundel} tidak dapat diunduh"; exit 1; }

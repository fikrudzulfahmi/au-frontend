# UJI mekanisme deploy atomik — HANYA manual (workflow_dispatch).
#
# Sengaja TIDAK berjalan otomatis saat push. `deploy-spa.yml` yang terbukti stabil tetap
# menangani deploy otomatis, sehingga pipeline pemilik proyek tidak pernah terganggu
# selama mekanisme baru ini diuji.
#
# Cara pakai: Actions -> "Uji Deploy Atomik" -> Run workflow -> pilih mode.
#   mode=uji   : hanya memeriksa DNS, kunci host, dan sambungan SSH (tidak menulis apa pun)
#   mode=penuh : mengunggah rilis lalu menukar index.html secara atomik
#
# Semua kegagalan dicetak sebagai anotasi `::error::` pada ringkasan run, sehingga
# penyebabnya terbaca tanpa perlu membuka log penuh.

name: Uji Deploy Atomik

on:
  # Pemicu khusus branch uji: mendorong branch `uji-atomik` menjalankan pemeriksaan
  # baca-saja ini tanpa menyentuh `main`. Hapus blok ini setelah mekanisme terbukti.
  push:
    branches: [uji-atomik]
  workflow_dispatch:
    inputs:
      mode:
        description: 'uji = periksa sambungan saja; penuh = unggah dan tukar rilis'
        required: true
        default: 'penuh'
        type: choice
        options: ['uji', 'penuh']

concurrency:
  group: deploy-spa-atomik
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Ringkasan konfigurasi
        run: |
          echo "### Konfigurasi deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "| Kunci | Nilai |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| mode | ${{ inputs.mode }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SSH host | \`${{ secrets.SSH_HOST }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SSH port | \`${{ secrets.SSH_PORT }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SSH user | \`${{ secrets.SSH_USER }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| docroot | \`${{ secrets.DEPLOY_PATH_SPA }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| folder rilis | \`${{ secrets.DEPLOY_RELEASES_PATH || 'sipandu-releases' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| domain | \`${{ secrets.DEPLOY_DOMAIN }}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}

      - name: Siapkan kunci dan periksa sambungan
        id: sambung
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USER_SSH: ${{ secrets.SSH_USER }}
          KUNCI: ${{ secrets.SSH_KEY }}
          FRASA: ${{ secrets.SSH_PASSPHRASE }}
          SIDIK: ${{ secrets.SSH_FINGERPRINT }}
          LIVE_DIR: ${{ secrets.DEPLOY_PATH_SPA }}
        run: |
          set -uo pipefail
          ringkas() { echo "$*" >> "$GITHUB_STEP_SUMMARY"; }

          kosong=""
          [ -z "${HOST:-}" ]     && kosong="$kosong SSH_HOST"
          [ -z "${PORT:-}" ]     && kosong="$kosong SSH_PORT"
          [ -z "${USER_SSH:-}" ] && kosong="$kosong SSH_USER"
          [ -z "${KUNCI:-}" ]    && kosong="$kosong SSH_KEY"
          [ -z "${LIVE_DIR:-}" ] && kosong="$kosong DEPLOY_PATH_SPA"
          if [ -n "$kosong" ]; then
            echo "::error::Secret berikut kosong:$kosong"
            exit 1
          fi

          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KUNCI" > "$HOME/.ssh/deploy_key" && chmod 600 "$HOME/.ssh/deploy_key"
          # Lepas frasa sandi hanya bila kunci memang terenkripsi (jangan sentuh bila tidak).
          if ! ssh-keygen -y -f "$HOME/.ssh/deploy_key" -P '' >/dev/null 2>&1; then
            if [ -n "${FRASA:-}" ]; then
              if ssh-keygen -p -P "$FRASA" -N '' -f "$HOME/.ssh/deploy_key" >/dev/null 2>&1; then
                ringkas "Kunci berfrasa sandi: berhasil dilepas."
              else
                echo "::error::Kunci terenkripsi tetapi SSH_PASSPHRASE tidak cocok."
                exit 1
              fi
            else
              echo "::error::Kunci privat terenkripsi tetapi SSH_PASSPHRASE kosong."
              exit 1
            fi
          fi
          ringkas "Kunci privat terbaca."

          # --- DNS: pastikan host yang dipakai memang mengarah ke server yang dituju.
          alamat=$(getent hosts "$HOST" | awk '{print $1}' | paste -sd, - || true)
          echo "DNS $HOST -> ${alamat:-TIDAK TERESOLVE}"
          ringkas "DNS \`$HOST\` → \`${alamat:-tidak teresolve}\`"

          # --- Kunci host: JANGAN percaya ssh-keyscan.
          # Terbukti di lapangan: kunci hasil `ssh-keyscan` bisa berbeda dengan kunci yang
          # benar-benar disajikan saat menyambung ("Offending ED25519 key"), kemungkinan
          # karena satu nama host dilayani lebih dari satu server.
          # Jadi: sambung sekali dengan penerimaan sementara, catat kunci YANG DISAJIKAN,
          # lalu VERIFIKASI kunci itu terhadap sidik jari acuan dari secret. Setelah cocok,
          # kunci itu dijadikan known_hosts dan sambungan sebenarnya memakai pinning ketat.
          SEMENTARA="/tmp/kh_sementara"
          : > "$SEMENTARA"
          ssh -i "$HOME/.ssh/deploy_key" -p "$PORT" \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile="$SEMENTARA" \
              -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=25 \
              "$USER_SSH@$HOST" 'true' >/dev/null 2>&1 || true

          if [ ! -s "$SEMENTARA" ]; then
            # Kunci bisa tidak tercatat bila koneksi gagal sebelum pertukaran kunci;
            # pakai ssh-keyscan sebagai cadangan, lalu tetap diverifikasi di bawah.
            ssh-keyscan -T 20 -p "$PORT" "$HOST" 2>/dev/null > "$SEMENTARA" || true
          fi
          if [ ! -s "$SEMENTARA" ]; then
            echo "::error::Tidak ada kunci host yang dapat dibaca dari $HOST:$PORT"
            exit 1
          fi

          ssh-keygen -lf "$SEMENTARA" | tee /tmp/sidik_saji
          # Selalu tampilkan kunci yang disajikan agar perubahan kunci host segera terlihat.
          echo "::notice::Kunci host yang disajikan server: $(tr '\n' ' ' < /tmp/sidik_saji)"
          ringkas "Kunci host yang disajikan server:"
          ringkas "\`\`\`&#10;$(sed 's/$/<br>/' /tmp/sidik_saji)&#10;\`\`\`"

          # Kunci yang disajikan dicetak base64 supaya dapat dituangkan ke
          # `deploy/known_hosts` bila server berganti kunci.
          kunci64=$(base64 -w0 "$SEMENTARA" 2>/dev/null || base64 < "$SEMENTARA" | tr -d '\n')
          echo "::notice::KUNCI64=$kunci64"

          # Sumber kepercayaan UTAMA: berkas `deploy/known_hosts` di repo. Isinya kunci
          # yang benar-benar disajikan kepada runner, sehingga tidak bergantung pada hasil
          # ssh-keyscan dari jaringan lain. Kunci publik host bukan rahasia.
          ACUAN_REPO="deploy/known_hosts"

          if [ -f "$ACUAN_REPO" ] && [ -s "$ACUAN_REPO" ]; then
            cp "$ACUAN_REPO" "$HOME/.ssh/known_hosts" && chmod 600 "$HOME/.ssh/known_hosts"
            ringkas "Acuan kunci: berkas repo \`$ACUAN_REPO\`"
            if ssh -i "$HOME/.ssh/deploy_key" -p "$PORT" \
                   -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                   -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=25 \
                   "$USER_SSH@$HOST" 'true' >/dev/null 2>&1; then
              ringkas "Kunci host COCOK dengan berkas repo."
            else
              echo "::error::Kunci host TIDAK cocok dengan $ACUAN_REPO. Perbarui berkas itu memakai nilai KUNCI64 pada anotasi ini (decode base64)."
              exit 1
            fi
          elif [ -n "${SIDIK:-}" ]; then
            acuan=$(printf '%s\n' "$SIDIK" | grep -oE 'SHA256:[A-Za-z0-9+/=]+' | head -1 || true)
            if [ -z "$acuan" ]; then
              echo "::error::SSH_FINGERPRINT tidak memuat nilai berbentuk SHA256:..."
              exit 1
            fi
            if grep -qF "$acuan" /tmp/sidik_saji; then
              ringkas "Acuan kunci: secret (sidik jari \`$acuan\`) — COCOK."
              cp "$SEMENTARA" "$HOME/.ssh/known_hosts" && chmod 600 "$HOME/.ssh/known_hosts"
            else
              saji=$(head -1 /tmp/sidik_saji)
              echo "::error::Sidik jari TIDAK cocok. Acuan: $acuan | Disajikan: $saji"
              exit 1
            fi
          else
            echo "::error::Tidak ada acuan kunci: berkas $ACUAN_REPO tidak ada dan SSH_FINGERPRINT kosong."
            exit 1
          fi

          cp "$SEMENTARA" "$HOME/.ssh/known_hosts" && chmod 600 "$HOME/.ssh/known_hosts"

          OPS="-i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=25"
          REMOTE="$USER_SSH@$HOST"

          echo "--- uji sambungan ---"
          if keluar=$(ssh $OPS "$REMOTE" 'echo TERSAMBUNG; whoami; pwd' 2>&1); then
            echo "$keluar"
            ringkas "\`\`\`&#10;$(echo "$keluar" | sed 's/$/<br>/')&#10;\`\`\`"
          else
            echo "::error::SSH gagal: $(echo "$keluar" | tail -5 | tr '\n' ' | ')"
            exit 1
          fi

          # --- Apakah docroot yang dituju benar-benar ada dan berisi situs kita?
          if keluar=$(ssh $OPS "$REMOTE" "test -d '$LIVE_DIR' && echo DOCROOT_ADA && ls -1 '$LIVE_DIR' | head -10" 2>&1); then
            echo "$keluar"
            ringkas "Docroot ada. Isi awal: \`$(echo "$keluar" | tail -n +2 | paste -sd' ' -)\`"
          else
            echo "::error::Docroot tidak dapat dibaca: $LIVE_DIR — $(echo "$keluar" | tail -3 | tr '\n' ' ')"
            exit 1
          fi

          echo "SAMBUNGAN SIAP"
          echo "::notice::SAMBUNGAN SIAP host=$HOST port=$PORT user=$USER_SSH dns=${alamat:-?} docroot=$LIVE_DIR"

      - name: Unggah dan tukar rilis
        # Push di branch uji menjalankan mode penuh; workflow_dispatch mengikuti input.
        # Catatan: `inputs` kosong pada pemicu push, sehingga default input TIDAK berlaku
        # di sana — karena itu kondisinya menyebut event_name secara eksplisit.
        if: inputs.mode == 'penuh' || github.event_name == 'push'
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USER_SSH: ${{ secrets.SSH_USER }}
          LIVE_DIR: ${{ secrets.DEPLOY_PATH_SPA }}
          RELEASES_DIR: ${{ secrets.DEPLOY_RELEASES_PATH || 'sipandu-releases' }}
          RELEASE_ID: ${{ github.run_id }}
          DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          set -uo pipefail
          OPS="-i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=25"
          REMOTE="$USER_SSH@$HOST"

          gagal() { echo "::error::$1"; exit 1; }

          tar czf /tmp/rilis.tgz -C dist . || gagal "gagal membuat paket rilis"
          echo "paket rilis: $(du -h /tmp/rilis.tgz | cut -f1)"

          # Direktori rilis (di luar docroot, tidak dapat diakses dari web).
          if ! keluar=$(ssh $OPS "$REMOTE" "mkdir -p '$RELEASES_DIR/$RELEASE_ID' && echo SIAP" 2>&1); then
            gagal "ssh mkdir gagal: $keluar"
          fi
          echo "direktori rilis: $keluar"

          # Unggah paket + skrip swap.
          if ! keluar=$(scp $OPS /tmp/rilis.tgz deploy/deploy-swap.sh "$REMOTE:$RELEASES_DIR/$RELEASE_ID/" 2>&1); then
            gagal "scp gagal: $keluar"
          fi
          echo "berkas terunggah"

          if ! keluar=$(ssh $OPS "$REMOTE" "cd '$RELEASES_DIR/$RELEASE_ID' && tar xzf rilis.tgz && rm -f rilis.tgz && ls -1 | head -8" 2>&1); then
            gagal "ekstrak gagal: $keluar"
          fi
          echo "isi rilis:"
          echo "$keluar"

          # Tukar rilis (skrip ada di repo: deploy/deploy-swap.sh).
          if ! keluar=$(ssh $OPS "$REMOTE" "cd '$RELEASES_DIR/$RELEASE_ID' && LIVE_DIR='$LIVE_DIR' RELEASES_DIR='$RELEASES_DIR' RELEASE_ID='$RELEASE_ID' DOMAIN='${DOMAIN:-}' bash deploy-swap.sh" 2>&1); then
            echo "::error::Swap gagal: $(echo "$keluar" | tail -20 | tr '\n' ' | ')"
            exit 1
          fi
          echo "$keluar"

          rm -f "$HOME/.ssh/deploy_key" /tmp/rilis.tgz

      - name: Verifikasi situs
        if: inputs.mode == 'penuh' || github.event_name == 'push'
        env:
          DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          set -euo pipefail
          if [ -z "${DOMAIN}" ]; then echo "::warning::DEPLOY_DOMAIN kosong"; exit 0; fi
          for jalur in / /masuk /dashboard /tv; do
            kode=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "https://${DOMAIN}${jalur}" || echo 000)
            echo "${jalur} -> ${kode}"
            [ "$kode" = "200" ] || { echo "::error::${jalur} menjawab ${kode}"; exit 1; }
          done
